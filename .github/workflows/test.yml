name: Synthetic Stage 1 verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_contracts.py && git diff --exit-code docs/openapi.json schemas/normalized-v1.json
      - run: node --check frontend/app.js
      - run: node tests/test_frontend.cjs
      - run: node tests/test_preview.cjs && node scripts/build-preview.mjs
